services:
  - type: web
    name: qronnect-backend
    env: node
    plan: starter
    buildCommand: rm -rf dist node_modules/.cache && npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET
        sync: false # Obligatorio: el backend no arranca sin él (openssl rand -base64 48)
      - key: PUBLIC_BACKEND_URL
        sync: false # Origen público del backend, sin /api (https://...). Se usa para validar la firma de los webhooks de Twilio
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: CONTACT_EMAIL
        sync: false # Dónde llegan las solicitudes del formulario de contacto de la web (por defecto sales@qronnect.com)
      - key: SMS_ACCOUNT_SID
        sync: false
      - key: SMS_AUTH_TOKEN
        sync: false
      - key: SMS_FROM_NUMBER
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: gemini # Change to 'openai' to switch provider

services:
  - type: web
    name: qronnect-backend
    env: node
    plan: starter
    buildCommand: rm -rf dist node_modules/.cache && npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: SMS_ACCOUNT_SID
        sync: false
      - key: SMS_AUTH_TOKEN
        sync: false
      - key: SMS_FROM_NUMBER
        sync: false
      - key: GEMINI_API_KEY
        sync: false

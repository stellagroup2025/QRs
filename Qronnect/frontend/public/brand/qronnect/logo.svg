<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Fondo con gradiente -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="qrGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f9ff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Fondo redondeado -->
  <rect width="200" height="200" fill="url(#bgGradient)" rx="30"/>

  <!-- QR Code estilizado en el centro -->
  <g transform="translate(100, 100)">
    <!-- Marco del QR -->
    <rect x="-60" y="-60" width="120" height="120" fill="url(#qrGradient)" rx="8"/>

    <!-- Esquinas del QR (características distintivas) -->
    <!-- Esquina superior izquierda -->
    <rect x="-50" y="-50" width="30" height="30" fill="#0ea5e9" rx="4"/>
    <rect x="-44" y="-44" width="18" height="18" fill="white" rx="2"/>
    <rect x="-40" y="-40" width="10" height="10" fill="#0ea5e9" rx="1"/>

    <!-- Esquina superior derecha -->
    <rect x="20" y="-50" width="30" height="30" fill="#0ea5e9" rx="4"/>
    <rect x="26" y="-44" width="18" height="18" fill="white" rx="2"/>
    <rect x="30" y="-40" width="10" height="10" fill="#0ea5e9" rx="1"/>

    <!-- Esquina inferior izquierda -->
    <rect x="-50" y="20" width="30" height="30" fill="#0ea5e9" rx="4"/>
    <rect x="-44" y="26" width="18" height="18" fill="white" rx="2"/>
    <rect x="-40" y="30" width="10" height="10" fill="#0ea5e9" rx="1"/>

    <!-- Patrón de puntos en el centro (simula QR) -->
    <circle cx="-10" cy="0" r="4" fill="#0ea5e9"/>
    <circle cx="0" cy="0" r="4" fill="#0ea5e9"/>
    <circle cx="10" cy="0" r="4" fill="#0ea5e9"/>
    <circle cx="-10" cy="10" r="4" fill="#0ea5e9"/>
    <circle cx="10" cy="10" r="4" fill="#0ea5e9"/>
    <circle cx="0" cy="-10" r="4" fill="#0ea5e9"/>
    <circle cx="30" cy="30" r="4" fill="#0ea5e9"/>
  </g>

  <!-- Texto "Q" estilizado en la parte inferior (opcional) -->
  <text x="100" y="175" font-family="Arial, sans-serif" font-size="36" font-weight="bold"
        fill="white" text-anchor="middle">Q</text>
</svg>
